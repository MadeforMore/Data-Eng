CREATE WAREHOUSE IF NOT EXISTS       --- 1st create the Wherehouse 
ECOMMERCE_WH
WITH
    WAREHOUSE_SIZE = 'XSMALL'
    AUTO_SUSPEND = 60
    AUTO_RESUME = TRUE
    INITIALLY_SUSPENDED = TRUE;


CREATE DATABASE IF NOT EXISTS ECOMMERCE_DB;  --2nd create the DB

CREATE SCHEMA IF NOT EXISTS             ---3rd create the Schema
ECOMMERCE_DB.ANALYTICS;

USE WAREHOUSE ECOMMERCE_WH;    --- use the created respurces , by using this the Snowflake knows which respurces we have to use

USE DATABASE ECOMMERCE_DB;

USE SCHEMA ANALYTICS;



--now Verify everything
SHOW WAREHOUSES;

SHOW DATABASES;

SHOW SCHEMAS IN DATABASE ECOMMERCE_DB;


SELECT
    CURRENT_DATABASE(),
    CURRENT_SCHEMA(),
    CURRENT_WAREHOUSE();


CREATE TABLE DIM_CUSTOMER (
    CUSTOMER_KEY NUMBER(10,0) IDENTITY(1,1),
    CUSTOMER_ID VARCHAR(50),
    CUSTOMER_NAME VARCHAR(100),
    EMAIL VARCHAR(150),
    GENDER VARCHAR(20),
    REGISTRATION_DATE DATE,
    CREATED_AT TIMESTAMP_NTZ DEFAULT CURRENT_TIMESTAMP(),
    CONSTRAINT PK_DIM_CUSTOMER PRIMARY KEY (CUSTOMER_KEY)
);



DESC TABLE DIM_CUSTOMER;

SHOW TABLES IN SCHEMA ANALYTICS;


